<body>
<main>
<h1 style="font-size:22px;font-weight:500;margin:0 0 2px">ทบทวนสอบ 0299005 Data Analysis with ML</h1>
<p class="s" style="margin:0 0 6px">สอบจันทร์ 23 พ.ย. 2569 เวลา 09:00–12:00 น. · ปรนัย 50 ข้อ · 50% มาจากควิซในคอร์ส · เรียนตามเลขในแถบด้านล่าง (เริ่มจาก 1) แต่ละบทมีคำอธิบายแบบเริ่มจากศูนย์ คำศัพท์ สูตรพร้อมตัวอย่าง แล็บ จุดที่ข้อสอบชอบถาม และควิซ</p>
<div id="nav"></div>
<div id="view"><p class="s">กำลังโหลดบทเรียน…</p></div>
<script>
const $=id=>document.getElementById(id);
const C={b:'#2a78d6',o:'#eb6834',v:'#6250d6',t:'#1baf7a',gr:'#888780',r:'#e34948',am:'#EF9F27'};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function rng(s){return()=>(s=s*16807%2147483647)/2147483647}
function gau(r){return Math.sqrt(-2*Math.log(r()+1e-12))*Math.cos(2*Math.PI*r())}
function plot(el,ser,o){const W=640,H=o.h||200,p=16,sx=x=>p+(x-o.x0)/(o.x1-o.x0)*(W-2*p),cl=y=>Math.max(o.y0,Math.min(o.y1,y)),sy=y=>H-p-(cl(y)-o.y0)/(o.y1-o.y0)*(H-2*p);let s='';if(o.zero&&o.y0<0&&o.y1>0)s+=`<line x1="${p}" x2="${W-p}" y1="${sy(0)}" y2="${sy(0)}" stroke="var(--border-strong)" stroke-width="0.5"/>`;s+=`<line x1="${p}" x2="${W-p}" y1="${H-p}" y2="${H-p}" stroke="var(--border-strong)" stroke-width="0.5"/>`;for(const q of ser){if(q.line)s+=`<polyline fill="none" stroke="${q.c}" stroke-width="${q.w||2}" ${q.d?'stroke-dasharray="5 4"':''} stroke-linejoin="round" stroke-linecap="round" points="${q.pts.map(a=>sx(a[0]).toFixed(1)+','+sy(a[1]).toFixed(1)).join(' ')}"/>`;if(q.dot)for(const a of q.pts)s+=`<circle cx="${sx(a[0]).toFixed(1)}" cy="${sy(a[1]).toFixed(1)}" r="${q.r||4}" fill="${q.ho?'none':q.c}" stroke="${q.c}" stroke-width="1.5"/>`}el.setAttribute('viewBox',`0 0 ${W} ${H}`);el.innerHTML=s}
function polyfit(xs,ys,d,l){const n=d+1,A=[...Array(n)].map(()=>Array(n+1).fill(0));for(let k=0;k<xs.length;k++){const p=[];let v=1;for(let i=0;i<n;i++){p.push(v);v*=xs[k]}for(let i=0;i<n;i++){for(let j=0;j<n;j++)A[i][j]+=p[i]*p[j];A[i][n]+=p[i]*ys[k]}}for(let i=1;i<n;i++)A[i][i]+=(l+1e-9)*xs.length;for(let c=0;c<n;c++){let m=c;for(let r=c+1;r<n;r++)if(Math.abs(A[r][c])>Math.abs(A[m][c]))m=r;[A[c],A[m]]=[A[m],A[c]];const pv=A[c][c]||1e-12;for(let r=0;r<n;r++){if(r===c)continue;const f=A[r][c]/pv;for(let k=c;k<=n;k++)A[r][k]-=f*A[c][k]}}return A.map((r,i)=>r[n]/(r[i]||1e-12))}
const pv=(w,x)=>w.reduceRight((a,c)=>a*x+c,0);
function box(x,y,w,h,c,t1,t2){return `<g class="c-${c}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" stroke-width="0.5"/><text class="th" x="${x+w/2}" y="${t2?y+h/2-8:y+h/2}" text-anchor="middle" dominant-baseline="central">${t1}</text>${t2?`<text class="ts" x="${x+w/2}" y="${y+h/2+10}" text-anchor="middle" dominant-baseline="central">${t2}</text>`:''}</g>`}
const ar=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="arr" marker-end="url(#arrow)"/>`;
const DEF='<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>';
const sld=(id,label,min,max,step,val,lw=120)=>`<div class="rw"><span style="min-width:${lw}px">${label}</span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" style="flex:1"><b id="${id}v" style="min-width:36px;text-align:right">${val}</b></div>`;

const L={
overfit:{h:'Overfitting เห็นด้วยตา',s:'เลื่อน degree แล้วดูเส้นโมเดล (ม่วง) ว่าวิ่งผ่านจุด train (น้ำเงิน) และทายจุด test (ส้มกลวง) ได้ดีแค่ไหน ลองตั้ง degree 9 แล้วเลือก λ = 0.001 เส้นจะกลับมาเรียบ ถ้า λ แรงเกินไปจะกลายเป็น underfitting',
html:`<div class="rw"><span style="min-width:120px">Polynomial degree</span><input type="range" id="dg" min="1" max="9" step="1" value="1" style="flex:1"><b id="dgv" style="min-width:16px">1</b></div>
<div class="rw"><span style="min-width:120px">Ridge λ (L2)</span><select id="lm"><option value="0">0 ไม่มี regularization</option><option value="0.001">0.001</option><option value="0.01">0.01</option><option value="0.2">0.2 แรงเกินไป</option></select></div>
<div class="lg"><span><i style="background:${C.b}"></i>train</span><span><i style="background:${C.o}"></i>test</span><span><i style="background:${C.v}"></i>เส้นโมเดล</span></div>
<svg id="fs" width="100%" role="img" aria-label="จุดข้อมูลและเส้นโมเดล polynomial"></svg>
<div class="rw"><div class="st"><span>Train error</span><b id="e1">-</b></div><div class="st"><span>Test error</span><b id="e2">-</b></div><span id="vd" class="pill"></span></div>
<p class="s" style="margin:10px 0 2px">Error ทุก degree: train (น้ำเงิน) ลดลงเรื่อย ๆ ส่วน test (ส้มเส้นประ) ลดลงก่อนแล้วพุ่งขึ้น</p>
<svg id="es" width="100%" role="img" aria-label="error ตาม degree"></svg>`,
init(){const r=rng(11),f=x=>Math.sin(2*Math.PI*x);const tr=[...Array(10)].map((_,i)=>{const x=(i+.5)/10+(r()-.5)*.04;return[x,f(x)+gau(r)*.3]}),te=[...Array(11)].map((_,i)=>{const x=i/10;return[x,f(x)+gau(r)*.3]});const z=x=>2*x-1,fit=(d,l)=>polyfit(tr.map(a=>z(a[0])),tr.map(a=>a[1]),d,l),mse=(w,ps)=>ps.reduce((s,a)=>s+(pv(w,z(a[0]))-a[1])**2,0)/ps.length;
const up=()=>{const d=+$('dg').value,l=+$('lm').value;$('dgv').textContent=d;const w=fit(d,l);plot($('fs'),[{pts:[...Array(161)].map((_,i)=>[i/160,pv(w,z(i/160))]),c:C.v,line:1},{pts:tr,c:C.b,dot:1},{pts:te,c:C.o,dot:1,ho:1}],{x0:0,x1:1,y0:-1.9,y1:1.9,h:210,zero:1});
const E=[...Array(9)].map((_,i)=>{const v=fit(i+1,l);return[i+1,mse(v,tr),mse(v,te)]});const a=E[d-1][1],b=E[d-1][2],best=Math.min(...E.map(e=>e[2]));$('e1').textContent=a.toFixed(3);$('e2').textContent=b>99?'> 99':b.toFixed(3);
const v=$('vd');if(d<=2||a>.15){v.className='pill y';v.textContent='Underfitting: bias สูง โมเดลง่ายเกินไปหรือ λ แรงเกินไป'}else if(b>best*1.8&&b>2*a){v.className='pill r';v.textContent='Overfitting: variance สูง จำ train ได้แต่ทาย test พลาด'}else{v.className='pill g';v.textContent='พอดี: error ต่ำทั้ง train และ test'}

init(){const D=['<b>Think like human (Strong AI)</b>: พยายามเลียนแบบการคิดของสมองจริง ๆ ยากมากเพราะเรายังไม่รู้ว่าสมองแปลภาพหรือเสียงเป็นความเข้าใจได้อย่างไร','<b>Think rationally</b>: ใช้กฎตรรกะ เช่น "ฝนตก → พื้นเปียก" แต่ถ้าเห็นพื้นเปียก ไม่ได้แปลว่าฝนตกเสมอ ระบบต้องหาสาเหตุจริงให้ได้','<b>Act like human (Weak AI)</b>: ไม่ต้องคิดเหมือนคน ขอแค่ผลลัพธ์เหมือนคน เทียบกับพี่น้องไรท์ที่ทำเครื่องบินบินได้โดยไม่ต้องกระพือปีก<svg width="100%" viewBox="0 0 680 128" role="img" aria-label="Turing test">'+DEF+box(30,40,150,44,'gray','ผู้ประเมิน','ถามผ่านข้อความ')+'<line x1="250" y1="6" x2="250" y2="122" stroke="var(--border-strong)" stroke-dasharray="4 4"/>'+ar(182,56,318,30)+ar(182,70,318,98)+box(320,8,140,40,'teal','A: คน')+box(320,80,140,40,'purple','B: เครื่อง')+'<text class="ts" x="480" y="60">Turing test: แยกไม่ออก</text><text class="ts" x="480" y="78">ว่าใครคือเครื่อง = ผ่าน</text></svg><b>Chinese Room</b>: คนในห้องไม่รู้ภาษาจีน แต่เปิดคู่มือจับคู่คำถามกับคำตอบ คนนอกห้องเลยเห็นเหมือน "เข้าใจภาษาจีน" = ทำเหมือนเข้าใจโดยไม่เข้าใจจริง','<b>Act rationally</b>: การกระทำออกมาสมเหตุสมผล ไม่จำเป็นต้องคิดแบบมีเหตุผลทุกขั้น เช่น รถไร้คนขับที่ขับได้ปลอดภัย'];const sel=i=>{document.querySelectorAll('.qd').forEach(b=>b.classList.toggle('on',+b.dataset.q===i));$('qdd').innerHTML=D[i]};document.querySelectorAll('.qd').forEach(b=>b.onclick=()=>sel(+b.dataset.q));sel(2)}},
search:{h:'BFS กับ DFS ใน state space',s:'เลือกวิธีแล้วกด "เล่นจนจบ" คลิกโหนดไหนก็ได้เพื่อย้ายเป้าหมาย สังเกตว่า BFS เก็บ frontier เยอะ (กินหน่วยความจำ) ส่วน DFS ลงลึกจนสุดกิ่ง (ถ้าเป้าหมายอยู่อีกกิ่งจะเสียเวลา)',
html:`<div class="rw"><button id="bB">BFS · กว้างก่อน</button><button id="bD">DFS · ลึกก่อน</button><button id="bS"><i class="ti ti-player-track-next" aria-hidden="true"></i> ก้าวถัดไป</button><button id="bP"><i class="ti ti-player-play" aria-hidden="true"></i> เล่นจนจบ</button></div>

<div class="lg"><span><i style="background:${C.v}"></i>เยี่ยมแล้ว</span><span><i style="border:2px solid ${C.am}"></i>รอใน frontier (กินหน่วยความจำ)</span><span><i style="background:${C.t}"></i>เป้าหมาย</span></div>

init(){let mode='B',goal=7,vis=[],fr=[1],mx=1,done=false,tm=null;const pos=n=>{const L=Math.floor(Math.log2(n)),i=n-2**L;return[20+(i+.5)*640/2**L,20+L*46]};
const draw=()=>{let s='';for(let n=2;n<32;n++){const[a,b]=pos(n),[c,d]=pos(n>>1);s+=`<line x1="${c}" y1="${d}" x2="${a}" y2="${b}" stroke="var(--border-strong)" stroke-width="0.5"/>`}for(let n=1;n<32;n++){const[a,b]=pos(n),v=vis.includes(n),f=fr.includes(n),g=n===goal;s+=`<circle data-n="${n}" cx="${a}" cy="${b}" r="10" fill="${g&&v?C.t:v?C.v:'var(--surface-1)'}" stroke="${g?C.t:f?C.am:'var(--border-strong)'}" stroke-width="${g||f?2.5:0.5}" style="cursor:pointer"/>`}$('tv').innerHTML=s;$('tv').querySelectorAll('circle').forEach(c=>c.onclick=()=>{goal=+c.dataset.n;reset()});$('bn').textContent=vis.length;$('bf').textContent=fr.length;$('bm').textContent=mx;$('bB').className=mode==='B'?'on':'';$('bD').className=mode==='D'?'on':''};
const reset=()=>{clearInterval(tm);vis=[];fr=[1];mx=1;done=false;$('bt').className='';$('bt').textContent='';draw()};
const step=()=>{if(!$('tv')){clearInterval(tm);return}if(done)return;const n=mode==='B'?fr.shift():fr.pop();vis.push(n);if(n===goal){done=true;const t=$('bt');t.className='pill a';t.textContent=mode==='B'?`BFS เจอใน ${vis.length} ก้าว · frontier สูงสุด ${mx} โหนด → จุดอ่อนคือหน่วยความจำ`:`DFS เจอใน ${vis.length} ก้าว · frontier สูงสุดแค่ ${mx} → ประหยัดหน่วยความจำ แต่ต้องลงลึกให้สุดกิ่งก่อน จุดอ่อนคือเวลา`}else if(n<16){mode==='B'?fr.push(2*n,2*n+1):fr.push(2*n+1,2*n)}mx=Math.max(mx,fr.length);if(!fr.length)done=true;draw()};
$('bB').onclick=()=>{mode='B';reset()};$('bD').onclick=()=>{mode='D';reset()};$('bS').onclick=step;$('bP').onclick=()=>{clearInterval(tm);tm=setInterval(()=>{step();if(done)clearInterval(tm)},300)};reset()}},
fitline:{h:'หาเส้นตรงที่ทำให้ E ต่ำสุด',s:'ปรับความชัน m และจุดตัด c ให้เส้นผ่านข้อมูล เส้นแดงคือ error ของแต่ละจุด E คือผลรวม error กำลังสองคูณ ½ ลองหามือก่อนแล้วค่อยกดปุ่มให้คำนวณเส้นที่ดีที่สุด',
html:`${sld('lnm','ความชัน m',-1,3,0.01,0.5)}${sld('lnc','จุดตัด c',-2,4,0.01,1)}<svg id="lns" width="100%" role="img" aria-label="ข้อมูลและเส้นตรง"></svg><div class="rw"><div class="st"><span>E = ½Σ(t − o)²</span><b id="lnE"></b></div><div class="st"><span>E ต่ำสุดที่เป็นไปได้</span><b id="lnB"></b></div><button id="lnF">หาเส้นที่ E ต่ำสุด</button></div><p class="s mono" id="lnX" style="margin:0"></p>`,
init(){const P=[[1,2],[2,3.5],[3,3.8],[4,5.5],[5,6.2]],n=5,sx=15,sy=P.reduce((s,p)=>s+p[1],0),sxy=P.reduce((s,p)=>s+p[0]*p[1],0),sxx=55,bm=(n*sxy-sx*sy)/(n*sxx-sx*sx),bc=(sy-bm*sx)/n,E=(m,c)=>.5*P.reduce((s,p)=>s+(p[1]-(m*p[0]+c))**2,0);$('lnB').textContent=E(bm,bc).toFixed(3);

cost:{h:'Error แต่ละแบบมีต้นทุนไม่เท่ากัน',s:'ตัวอย่างจากวิดีโอบทที่ 9 กดเปลี่ยนสถานการณ์แล้วดูว่า error แบบไหนร้ายแรงกว่า',

init(){const S=[[['ติดเชื้อ แต่ผลเป็นลบ (False Negative)','ออกไปข้างนอกแล้วแพร่เชื้อต่อ',95],['ไม่ติด แต่ผลเป็นบวก (False Positive)','ต้องกักตัวโดยไม่จำเป็น',30]],[['ติดเชื้อ แต่ผลเป็นลบ (False Negative)','คนส่วนใหญ่ฉีดวัคซีนแล้วและระวังตัว แพร่ได้น้อยลง',40],['ไม่ติด แต่ผลเป็นบวก (False Positive)','เสียโอกาสทำงานหรือไปเรียน',65]],[['ลูกค้าจะจ่ายได้ แต่ระบบปฏิเสธ','ธนาคารเสียโอกาสได้ลูกค้า',45],['ลูกค้าจะไม่จ่าย แต่ระบบอนุมัติ','เกิดหนี้เสีย ต้องตามทวงหนี้',90]]];
const sel=i=>{document.querySelectorAll('.ec').forEach(b=>b.classList.toggle('on',+b.dataset.s===i));$('ecv').innerHTML=S[i].map(e=>`<div style="margin:12px 0"><div style="font-size:13px;font-weight:500">${e[0]}</div><div style="font-size:12px;color:var(--text-secondary);margin:2px 0 4px">${e[1]}</div><div style="background:var(--bg-neutral);border-radius:3px;height:10px"><div style="width:${e[2]}%;height:10px;border-radius:3px;background:${e[2]>60?C.r:C.am}"></div></div></div>`).join('')+'<span class="pill a">ต้นทุนของ error เปลี่ยนตามสถานการณ์ จึงต้องเลือก metric (precision หรือ recall) ให้ตรงกับต้นทุนจริง</span>'};document.querySelectorAll('.ec').forEach(b=>b.onclick=()=>sel(+b.dataset.s));sel(0)}},
boom:{h:'ทำไม AI / ML บูม',s:'สามเหตุผลจากวิดีโอบทที่ 10',
html:`<svg width="100%" viewBox="0 0 680 124" role="img" aria-label="3 เหตุผลที่ AI บูม">${DEF}${box(20,10,190,50,'purple','Algorithm','พัฒนาต่อยอดกัน')}${box(245,10,190,50,'purple','Tools','ใช้ง่ายขึ้น')}${box(470,10,190,50,'purple','Computing power','GPU จากวงการเกม')}${ar(115,62,290,86)}${ar(340,62,340,84)}${ar(565,62,390,86)}${box(240,88,200,32,'coral','AI / ML บูม')}</svg>`},
decomp:{h:'แยกส่วนประกอบและทำให้ stationary',s:'เปิดหรือปิด trend, seasonal, noise แล้วลองแปลงข้อมูลด้วย log และ differencing ดูว่าเมื่อไหร่ rolling mean (ส้ม) นิ่งจนเป็น stationary',
html:`<div class="rw"><label><input type="checkbox" id="tT" checked> Trend</label><label><input type="checkbox" id="tS" checked> Seasonal (คาบ 12)</label><label><input type="checkbox" id="tN" checked> Noise</label><select id="tM"><option value="a">Additive</option><option value="m">Multiplicative</option></select></div>
<div class="rw"><span>แปลงข้อมูล</span><label><input type="checkbox" id="xL"> log</label><label><input type="checkbox" id="x1"> differencing lag 1</label><label><input type="checkbox" id="x12"> seasonal differencing lag 12</label></div>
<div class="lg"><span><i style="background:${C.b}"></i>ข้อมูล</span><span><i style="background:${C.o}"></i>rolling mean 12 จุด</span></div>
<svg id="tsg" width="100%" role="img" aria-label="กราฟ time series"></svg>
<span id="tsv" class="pill"></span><p id="tsr" class="s" style="margin:6px 0 0"></p>`,
init(){const r=rng(3),n=96,e=[...Array(n)].map(()=>gau(r));
const up=()=>{const tr=$('tT').checked,se=$('tS').checked,no=$('tN').checked,m=$('tM').value==='m',L=$('xL').checked,d1=$('x1').checked,d12=$('x12').checked;let y=[...Array(n)].map((_,t)=>{const T=tr?20+.35*t:30,S=se?Math.sin(2*Math.PI*t/12):0,E=no?e[t]:0;return m?T*(1+.3*S)*(1+.03*E):T+4*S+E});if(L)y=y.map(Math.log);let p=y.map((v,t)=>[t,v]);if(d1)p=p.slice(1).map((a,i)=>[a[0],a[1]-p[i][1]]);if(d12)p=p.slice(12).map((a,i)=>[a[0],a[1]-p[i][1]]);
const rm=p.slice(11).map((a,i)=>[a[0],p.slice(i,i+12).reduce((s,b)=>s+b[1],0)/12]),vs=p.map(a=>a[1]),lo=Math.min(...vs),hi=Math.max(...vs),pd=(hi-lo)*.1||1;plot($('tsg'),[{pts:p,c:C.b,line:1,w:1.5},{pts:rm,c:C.o,line:1,d:1}],{x0:0,x1:n-1,y0:lo-pd,y1:hi+pd,h:190,zero:1});
const R=[];if(tr&&!d1&&!d12)R.push('ยังมี trend: mean เปลี่ยนไปตามเวลา → ลอง differencing lag 1');if(se&&!d12)R.push('ยังมี seasonal → ลอง seasonal differencing lag 12');if(m&&tr&&se&&!L)R.push('Multiplicative: แกว่งกว้างขึ้นตามระดับข้อมูล → ลอง log ให้กลายเป็น additive');const v=$('tsv');if(R.length){v.className='pill r';v.textContent='Non-stationary';$('tsr').innerHTML=R.join('<br>')}else{v.className='pill g';v.textContent='Stationary';$('tsr').textContent='mean และ variance คงที่ตลอดเวลา ถ้าทำ ADF test น่าจะได้ p < 0.05 พร้อมใช้ ARIMA ได้'}};
['tT','tS','tN','tM','xL','x1','x12'].forEach(k=>$(k).onchange=up);up()}},
smooth:{h:'Moving average กับ EMA',s:'MA ให้น้ำหนักทุกจุดเท่ากัน ส่วน EMA ให้จุดล่าสุดหนักกว่า ปรับดูว่าเส้นเรียบขึ้นและตามข้อมูลทันแค่ไหน',
html:`${sld('sw','MA window',1,15,1,6)}${sld('sa','EMA α',0.05,1,0.05,0.3)}<div class="lg"><span><i style="background:${C.gr}"></i>ข้อมูลจริง</span><span><i style="background:${C.b}"></i>Moving average</span><span><i style="background:${C.o}"></i>EMA</span></div><svg id="sg" width="100%" role="img" aria-label="กราฟ smoothing"></svg>`,
init(){const r=rng(9),y=[...Array(72)].map((_,t)=>10+3*Math.sin(2*Math.PI*t/12)+gau(r)*1.2);const up=()=>{const w=+$('sw').value,a=+$('sa').value;$('swv').textContent=w;$('sav').textContent=a.toFixed(2);const ma=y.map((_,t)=>t<w-1?null:[t,y.slice(t-w+1,t+1).reduce((s,v)=>s+v,0)/w]).filter(Boolean);let s=y[0];const em=y.map((v,t)=>{s=t?a*v+(1-a)*s:v;return[t,s]});plot($('sg'),[{pts:y.map((v,t)=>[t,v]),c:C.gr,line:1,w:1},{pts:ma,c:C.b,line:1},{pts:em,c:C.o,line:1,d:1}],{x0:0,x1:71,y0:4,y1:16,h:180})};$('sw').oninput=up;$('sa').oninput=up;up()}},
dist:{h:'Euclidean, Manhattan และ Cosine',s:'ปรับตำแหน่งจุด A และ B เส้นม่วงคือ Euclidean (เส้นตรง) เส้นส้มประคือ Manhattan (เดินตามช่องตาราง) เส้นเทาจากจุดกำเนิดใช้คิด cosine',
html:`<div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px">${sld('dax','A: x',0,8,1,1)}${sld('day','A: y',0,8,1,2)}${sld('dbx','B: x',0,8,1,4)}${sld('dby','B: y',0,8,1,6)}</div><svg id="dsv" width="100%" viewBox="0 0 680 300" role="img" aria-label="ระยะห่างระหว่างจุด A และ B"></svg><div class="rw"><div class="st"><span>Euclidean</span><b id="dE"></b></div><div class="st"><span>Manhattan</span><b id="dM"></b></div><div class="st"><span>Cosine similarity</span><b id="dC"></b></div></div><p class="s mono" id="dX" style="margin:0"></p>`,
init(){const X=x=>210+x*32.5,Y=y=>280-y*32.5;const up=()=>{const a=[+$('dax').value,+$('day').value],b=[+$('dbx').value,+$('dby').value];['dax','day','dbx','dby'].forEach(k=>$(k+'v').textContent=$(k).value);let s='';for(let i=0;i<=8;i++){s+=`<line x1="${X(i)}" y1="${Y(0)}" x2="${X(i)}" y2="${Y(8)}" stroke="var(--border)" stroke-width="0.5"/><line x1="${X(0)}" y1="${Y(i)}" x2="${X(8)}" y2="${Y(i)}" stroke="var(--border)" stroke-width="0.5"/>`}s+=`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(a[0])}" y2="${Y(a[1])}" stroke="${C.gr}" stroke-width="1"/><line x1="${X(0)}" y1="${Y(0)}" x2="${X(b[0])}" y2="${Y(b[1])}" stroke="${C.gr}" stroke-width="1"/><polyline points="${X(a[0])},${Y(a[1])} ${X(b[0])},${Y(a[1])} ${X(b[0])},${Y(b[1])}" fill="none" stroke="${C.o}" stroke-width="2.5" stroke-dasharray="6 4"/><line x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(b[0])}" y2="${Y(b[1])}" stroke="${C.v}" stroke-width="2.5"/><circle cx="${X(a[0])}" cy="${Y(a[1])}" r="7" fill="${C.b}"/><circle cx="${X(b[0])}" cy="${Y(b[1])}" r="7" fill="${C.r}"/><text class="th" x="${X(a[0])-12}" y="${Y(a[1])-12}" text-anchor="end">A</text><text class="th" x="${X(b[0])+12}" y="${Y(b[1])-12}">B</text><text class="ts" x="${X(0)}" y="${Y(0)+16}" text-anchor="middle">0</text>`;$('dsv').innerHTML=s;const dx=b[0]-a[0],dy=b[1]-a[1],eu=Math.hypot(dx,dy),mh=Math.abs(dx)+Math.abs(dy),na=Math.hypot(...a),nb=Math.hypot(...b),cs=na&&nb?(a[0]*b[0]+a[1]*b[1])/(na*nb):null;$('dE').textContent=+eu.toFixed(3);$('dM').textContent=mh;$('dC').textContent=cs==null?'—':cs.toFixed(3);$('dX').textContent=`Euclidean = √(${dx}² + ${dy}²) · Manhattan = |${dx}| + |${dy}| · Cosine = (A·B)/(‖A‖‖B‖)`};['dax','day','dbx','dby'].forEach(k=>$(k).oninput=up);up()}},
moons:{h:'k-means กับ DBSCAN บนข้อมูลรูปพระจันทร์',s:'ข้อสอบมีรูปนี้จริง กด k-means แล้วดู centroid (X) ขยับทีละรอบ จากนั้นเทียบกับ DBSCAN ว่าแบบไหนแยกสองวงได้',
html:`<div class="rw"><button id="mk"><i class="ti ti-player-play" aria-hidden="true"></i> k-means (k=2)</button><button id="md">DBSCAN</button><button id="mr"><i class="ti ti-refresh" aria-hidden="true"></i> รีเซ็ต</button></div><svg id="mv" width="100%" viewBox="0 0 680 290" role="img" aria-label="ข้อมูล two moons"></svg><span id="mt" class="pill"></span>`,
init(){const r=rng(5),P=[];for(let i=0;i<80;i++){const a=Math.PI*i/79;P.push([Math.cos(a)+gau(r)*.07,Math.sin(a)+gau(r)*.07]);P.push([1-Math.cos(a)+gau(r)*.07,.5-Math.sin(a)+gau(r)*.07])}const sx=x=>20+(x+1.3)/3.6*640,sy=y=>270-(y+.8)/2.1*250;let tm=null;
const draw=(lb,ce)=>{let s='';P.forEach((p,i)=>{const l=lb?lb[i]:null;s+=`<circle cx="${sx(p[0]).toFixed(1)}" cy="${sy(p[1]).toFixed(1)}" r="4" fill="${l===0?C.b:l===1?C.o:l===-1?'var(--border-stronger)':C.gr}" opacity="${l==null?.5:.9}"/>`});(ce||[]).forEach(c=>{const x=sx(c[0]),y=sy(c[1]);s+=`<path d="M${x-8} ${y-8}L${x+8} ${y+8}M${x+8} ${y-8}L${x-8} ${y+8}" stroke="var(--text-primary)" stroke-width="3" fill="none"/>`});$('mv').innerHTML=s};
const km=()=>{clearInterval(tm);let ce=[[-.8,.9],[2,-.3]],it=0,lb;const t=$('mt');t.className='pill a';tm=setInterval(()=>{if(!$('mv')){clearInterval(tm);return}lb=P.map(p=>{const d=ce.map(c=>(p[0]-c[0])**2+(p[1]-c[1])**2);return d[0]<=d[1]?0:1});const nc=[0,1].map(k=>{const q=P.filter((_,i)=>lb[i]===k);return[q.reduce((s,p)=>s+p[0],0)/q.length,q.reduce((s,p)=>s+p[1],0)/q.length]});const mv=Math.hypot(nc[0][0]-ce[0][0],nc[0][1]-ce[0][1]);ce=nc;it++;draw(lb,ce);t.textContent='k-means รอบที่ '+it;if(mv<1e-4||it>12){clearInterval(tm);t.textContent=`k-means เสร็จใน ${it} รอบ: แบ่งด้วยเส้นตรง จึงผ่าแต่ละวงเป็นสองท่อน แยกรูปทรงโค้งไม่ได้`}},500)};
const db=()=>{clearInterval(tm);const eps=.25,mp=5,N=P.map(p=>P.map((q,j)=>Math.hypot(p[0]-q[0],p[1]-q[1])<=eps?j:-1).filter(j=>j>=0)),lb=Array(P.length).fill(null);let c=0;P.forEach((_,i)=>{if(lb[i]!==null||N[i].length<mp)return;const st=[i];lb[i]=c;while(st.length){const j=st.pop();if(N[j].length<mp)continue;N[j].forEach(k=>{if(lb[k]===null||lb[k]===-1){const was=lb[k];lb[k]=c;if(was===null)st.push(k)}})}c++});P.forEach((_,i)=>{if(lb[i]===null)lb[i]=-1});draw(lb.map(l=>l>1?-1:l));const t=$('mt');t.className='pill g';t.textContent=`DBSCAN ได้ ${c} กลุ่มตามรูปทรงวง (รวมจุดที่หนาแน่นติดกัน) ไม่ต้องกำหนดจำนวนกลุ่มล่วงหน้า และจุดที่อยู่โดดเดี่ยวจะเป็น noise`};
$('mk').onclick=km;$('md').onclick=db;$('mr').onclick=()=>{clearInterval(tm);draw();$('mt').className='';$('mt').textContent=''};draw()}},
assoc:{h:'Association rule: ขนมปัง → นม',s:'ตะกร้าสินค้า 100 ใบ แต่ละช่องคือ 1 ตะกร้า ปรับจำนวนแล้วดู support, confidence และ lift',
html:`${sld('aA','ตะกร้าที่มีขนมปัง',0,100,1,40)}${sld('aB','ตะกร้าที่มีนม',0,100,1,50)}${sld('aX','มีทั้งสองอย่าง',0,100,1,30)}

<div class="rw"><div class="st"><span>Support</span><b id="sS"></b></div><div class="st"><span>Confidence</span><b id="sC"></b></div><div class="st"><span>Lift</span><b id="sL"></b></div></div><p class="s mono" id="sF" style="margin:0 0 6px"></p><span id="sM" class="pill a"></span>`,
init(){const up=()=>{let A=+$('aA').value,B=+$('aB').value,X=+$('aX').value;X=Math.min(X,A,B);if(A+B-X>100)X=A+B-100;$('aX').value=X;['aA','aB','aX'].forEach((k,i)=>$(k+'v').textContent=[A,B,X][i]);let g='';for(let i=0;i<100;i++){const c=i<X?C.v:i<A?C.b:i<A+B-X?C.o:'var(--bg-neutral)';g+=`<span style="width:18px;height:18px;border-radius:3px;background:${c}"></span>`}$('ag').innerHTML=g;const sup=X/100,conf=A?X/A:0,lift=B&&A?conf/(B/100):0;$('sS').textContent=sup.toFixed(2);$('sC').textContent=conf.toFixed(2);$('sL').textContent=lift.toFixed(2);$('sF').textContent=`support = ${X}/100 · confidence = ${X}/${A} · lift = confidence ÷ (${B}/100)`;$('sM').textContent=lift>1.05?'Lift > 1: ซื้อด้วยกันบ่อยกว่าที่ควรเป็นโดยบังเอิญ (สัมพันธ์ทางบวก)':lift<.95?'Lift < 1: ซื้อด้วยกันน้อยกว่าบังเอิญ (สัมพันธ์ทางลบ)':'Lift ≈ 1: สองอย่างไม่สัมพันธ์กัน'};['aA','aB','aX'].forEach(k=>$(k).oninput=up);up()}},

logic:{h:'เกตตรรกะแบบ 4 บิต',s:'กดบิตของ A และ B แล้วดูผลทีละหลัก ค่าตั้งต้นคือ A = 0100 และ B = 0010 จากควิซ',
html:`<div id="lgx"></div>`,
init(){const A=[0,1,0,0],B=[0,0,1,0];const cell=(v,k,i)=>k?`<button class="bit${v?' on':''}" data-k="${k}" data-i="${i}">${v}</button>`:`<span class="bit${v?' on':''}">${v}</span>`;const row=(l,a,k)=>`<div class="rw" style="gap:6px;margin:4px 0"><span style="min-width:110px" class="mono">${l}</span>${a.map((v,i)=>cell(v,k,i)).join('')}</div>`;const up=()=>{const op=f=>A.map((a,i)=>f(a,B[i]));$('lgx').innerHTML=row('A',A,'A')+row('B',B,'B')+'<div style="border-top:0.5px solid var(--border);margin:6px 0"></div>'+row('A AND B',op((a,b)=>a&b))+row('A OR B',op((a,b)=>a|b))+row('A XOR B',op((a,b)=>a^b))+row('NOT A',A.map(a=>1-a))+row('¬(¬A·¬B)',op((a,b)=>1-((1-a)&(1-b))));$('lgx').querySelectorAll('button').forEach(x=>x.onclick=()=>{(x.dataset.k==='A'?A:B)[+x.dataset.i]^=1;up()})};up()}},
memory:{h:'ลำดับชั้นหน่วยความจำ',s:'ยิ่งอยู่บนยิ่งเร็วและแพง แต่จุได้น้อย สีบอกว่าข้อมูลหายเมื่อไฟดับหรือไม่',

slice:{h:'เห็นภาพ string slicing',s:'พิมพ์ start, stop, step (เว้นว่างได้ ใช้เลขติดลบได้) ช่องที่ถูกเลือกจะเปลี่ยนสี ตัวเลขด้านบนคือ index บวก ด้านล่างคือ index ลบ',
html:`<div class="rw"><span class="mono">s =</span><input id="ss" value="Hello, it's me" maxlength="16" class="mono" style="flex:1;min-width:160px"></div><div class="rw mono" style="gap:4px"><span>s[</span><input id="sa" value="1" style="width:60px"><span>:</span><input id="sb" value="-5" style="width:60px"><span>:</span><input id="sc" value="2" style="width:60px"><span>]</span></div><div id="sv" style="display:flex;gap:3px;flex-wrap:wrap;margin:10px 0"></div><div class="rw"><span>ผลลัพธ์</span><b class="mono" id="so" style="font-size:16px"></b><span id="se" style="font-size:13px;color:var(--text-danger)"></span></div>`,
init(){const up=()=>{const s=$('ss').value,n=s.length,v=['sa','sb','sc'].map(k=>$(k).value.trim());$('se').textContent='';if(v.some(x=>x!==''&&!/^-?\d+$/.test(x))){$('se').textContent='ใส่จำนวนเต็มหรือเว้นว่างเท่านั้น';return}const st=v[2]===''?1:+v[2];if(st===0){$('se').textContent='step ห้ามเป็น 0';return}let a,b;const I=[];if(st>0){a=v[0]===''?0:+v[0];b=v[1]===''?n:+v[1];a=a<0?Math.max(0,a+n):Math.min(a,n);b=b<0?Math.max(0,b+n):Math.min(b,n);for(let i=a;i<b;i+=st)I.push(i)}else{a=v[0]===''?n-1:+v[0];a=a<0?Math.max(-1,a+n):Math.min(a,n-1);if(v[1]==='')b=-1;else{b=+v[1];b=b<0?Math.max(-1,b+n):Math.min(b,n-1)}for(let i=a;i>b;i+=st)I.push(i)}
$('sv').innerHTML=[...s].map((c,i)=>{const k=I.indexOf(i);return `<div style="text-align:center;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)"><div>${i}</div><div style="width:32px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:15px;border:0.5px solid var(--border-strong);${k>=0?'background:var(--bg-accent);color:var(--text-accent);':'color:var(--text-primary);'}">${c===' '?'␣':esc(c)}</div><div>${i-n}</div></div>`}).join('');$('so').textContent=JSON.stringify(I.map(i=>s[i]).join(''))};['ss','sa','sb','sc'].forEach(k=>$(k).oninput=up);up()}},

init(){let b=4;const up=()=>{const r=Math.floor(b/3),c=b%3,nb=[];if(r>0)nb.push(b-3);if(r<2)nb.push(b+3);if(c>0)nb.push(b-1);if(c<2)nb.push(b+1);let k=1;$('pz').innerHTML=[...Array(9)].map((_,i)=>i===b?`<button data-i="${i}" style="height:56px;background:var(--bg-neutral);border-style:dashed;font-size:12px">ว่าง</button>`:`<button data-i="${i}" class="${nb.includes(i)?'on':''}" style="height:56px;font-size:18px">${k++}</button>`).join('');$('pz').querySelectorAll('button').forEach(x=>x.onclick=()=>{b=+x.dataset.i;up()});$('pzn').textContent=nb.length+' ทาง';$('pzt').textContent=nb.length===4?'ช่องว่างอยู่ตรงกลาง มีแผ่นติดอยู่ทั้ง 4 ด้าน':nb.length===3?'ช่องว่างอยู่ริมขอบ มีแผ่นติดอยู่ 3 ด้าน':'ช่องว่างอยู่มุม มีแผ่นติดอยู่แค่ 2 ด้าน'};up()}},

nn:{h:'Neural network: ตาข่ายของโหนด',s:'วงกลมแต่ละวงคือโหนด (เลียนแบบเซลล์ประสาท) เส้นคือการเชื่อมต่อที่มีน้ำหนัก ข้อมูลไหลจากซ้าย (feature) ไปขวา (คำตอบ) เส้นน้ำเงินคือน้ำหนักบวก เส้นส้มคือน้ำหนักลบ เส้นยิ่งหนายิ่งมีผลมาก วงกลมยิ่งเข้มแปลว่าโหนดนั้นส่งค่าออกมาสูง ลองปรับ input, จำนวนโหนด และเพิ่ม hidden layer',
html:`<div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px">${sld('nx1','x₁',0,1,0.1,0.8,24)}${sld('nx2','x₂',0,1,0.1,0.2,24)}${sld('nx3','x₃',0,1,0.1,0.5,24)}</div>${sld('nh','จำนวนโหนดใน hidden layer',2,6,1,4,190)}<div class="rw"><label><input type="checkbox" id="n2"> เพิ่ม hidden layer ชั้นที่ 2 (ซับซ้อนขึ้น)</label></div><svg id="nns" width="100%" viewBox="0 0 680 295" role="img" aria-label="neural network"></svg><div class="rw"><div class="st"><span>Output (ความน่าจะเป็น)</span><b id="nno"></b></div><div class="st"><span>จำนวนพารามิเตอร์</span><b id="nnp"></b></div><span class="pill a" id="nnc"></span></div><p class="s" style="margin:4px 0 0">จำนวนพารามิเตอร์ = จำนวนเส้นเชื่อม (น้ำหนัก) + จำนวน bias ของทุกโหนดที่ไม่ใช่ input ยิ่งเพิ่มโหนดหรือชั้น โมเดลยิ่งซับซ้อน</p>`,
init(){const R=rng(21),Wt={};const getW=key=>{if(!Wt[key]){Wt[key]=[...Array(6)].map(()=>[...Array(6)].map(()=>(R()*2-1)*1.6));Wt[key+'b']=[...Array(6)].map(()=>(R()*2-1)*0.5)}return Wt[key]};const sg=z=>1/(1+Math.exp(-z));
const up=()=>{const x=[+$('nx1').value,+$('nx2').value,+$('nx3').value];['nx1','nx2','nx3'].forEach((k,i)=>$(k+'v').textContent=x[i].toFixed(1));const h=+$('nh').value;$('nhv').textContent=h;const two=$('n2').checked,tag=two?'t':'s';const sizes=[3,h].concat(two?[3]:[]).concat([1]);const acts=[x];let params=0;
for(let l=1;l<sizes.length;l++){const W=getW('L'+l+tag),B=Wt['L'+l+tag+'b'],prev=acts[l-1],a=[];for(let j=0;j<sizes[l];j++){let z=B[j];for(let i=0;i<sizes[l-1];i++)z+=W[j][i]*prev[i];a.push(sg(z))}acts.push(a);params+=sizes[l]*sizes[l-1]+sizes[l]}
const Lc=sizes.length,X=l=>90+l*(500/(Lc-1)),Y=(j,n)=>130+(j-(n-1)/2)*44;let s='';
for(let l=1;l<Lc;l++){const W=Wt['L'+l+tag];for(let j=0;j<sizes[l];j++)for(let i=0;i<sizes[l-1];i++){const w=W[j][i];s+=`<line x1="${X(l-1)}" y1="${Y(i,sizes[l-1])}" x2="${X(l)}" y2="${Y(j,sizes[l])}" stroke="${w>0?C.b:C.o}" stroke-width="${(0.5+Math.abs(w)*1.4).toFixed(2)}" opacity="0.55"/>`}}
for(let l=0;l<Lc;l++)for(let j=0;j<sizes[l];j++){const a=acts[l][j];s+=`<circle cx="${X(l)}" cy="${Y(j,sizes[l])}" r="15" fill="${l===0?C.t:C.v}" fill-opacity="${(0.12+0.88*a).toFixed(2)}" stroke="var(--border-stronger)" stroke-width="0.5"/>`;if(l===0)s+=tx(X(l)-22,Y(j,sizes[l]),'x'+(j+1)+' = '+a.toFixed(1),'ts','end');if(l===Lc-1)s+=tx(X(l)+22,Y(j,sizes[l]),a.toFixed(2),'th')}

let s=`<polygon points="${[[d,8],[d,252],[-d,252],[-d,8]].map(([o,y])=>xAt(c+o*nn,y).toFixed(1)+','+y).join(' ')}" fill="${C.am}" opacity="0.12"/>`+ln(-d,1)+ln(d,1)+ln(0,0);let n=0;
P.forEach(p=>{const inside=Math.abs(dist(p))<d;if(inside)n++;s+=dot(p[0].toFixed(1),p[1].toFixed(1),6,p[2]?C.o:C.b)+(inside?`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="10" fill="none" stroke="${C.am}" stroke-width="2"/>`:'')});
$('svs').innerHTML=s;$('svn').textContent=n+' จุด';$('svt').textContent=d<25?'margin แคบ: เข้มงวด ยอมให้ล้ำน้อย (เสี่ยง overfit)':d>55?'margin กว้าง: ยอมให้ล้ำเยอะ (slack มาก = regularize มาก)':'ปรับเพื่อแลกระหว่างความเข้มงวดกับการยอมให้ล้ำ'};$('svd').oninput=up;up()}},
onehot:{h:'Ordinal กับ One-hot encoding',s:'ซ้าย: หมวดที่มีลำดับ แปลงเป็นเลขเรียงกันได้ 1 คอลัมน์ ขวา: หมวดที่ไม่มีลำดับ แตกเป็นคอลัมน์ละหมวด แล้วใส่ 1 แค่ช่องเดียว',
html:`<div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:16px;align-items:start"><table class="tb"><thead><tr><th>ระดับการศึกษา</th><th class="tf">Ordinal</th></tr></thead><tbody><tr><td>ประถม</td><td class="hl">0</td></tr><tr><td>มัธยม</td><td class="hl">1</td></tr><tr><td>มหาวิทยาลัย</td><td class="hl">2</td></tr></tbody></table><table class="tb"><thead><tr><th>ประเภทห้อง</th><th class="tf">Single</th><th class="tf">Deluxe</th><th class="tf">Grand</th></tr></thead><tbody><tr><td>Single</td><td class="hl">1</td><td>0</td><td>0</td></tr><tr><td>Deluxe</td><td>0</td><td class="hl">1</td><td>0</td></tr><tr><td>Grand</td><td>0</td><td>0</td><td class="hl">1</td></tr></tbody></table></div><p class="s" style="margin:8px 0 0">Ordinal ได้ 1 คอลัมน์ ส่วน One-hot ได้ 3 คอลัมน์ (เท่ากับจำนวนหมวด)</p>`},
grid:{h:'Grid search: ต้องเทรนกี่รอบ',s:'แต่ละช่องคือชุดค่า hyper-parameter 1 ชุด และทุกชุดต้องเทรนครบทุก fold',
html:`${sld('gda','จำนวนค่าของ HP ตัวที่ 1',1,5,1,3,170)}${sld('gdb','จำนวนค่าของ HP ตัวที่ 2',1,5,1,3,170)}${sld('gdk','จำนวน fold',2,10,1,10,170)}<div id="gdg" style="display:grid;gap:4px;margin:10px 0"></div><div class="rw"><div class="st"><span>เทรนทั้งหมด</span><b id="gdt"></b></div><span class="mono" id="gdx" style="font-size:14px"></span></div>`,
init(){const up=()=>{const a=+$('gda').value,b=+$('gdb').value,k=+$('gdk').value;['gda','gdb','gdk'].forEach(i=>$(i+'v').textContent=$(i).value);const g=$('gdg');g.style.gridTemplateColumns=`repeat(${b},minmax(0,1fr))`;g.innerHTML=[...Array(a*b)].map((_,i)=>`<div style="background:var(--bg-accent);color:var(--text-accent);border-radius:6px;padding:6px;font-size:12px;text-align:center">ชุดที่ ${i+1}<br>เทรน ${k} รอบ</div>`).join('');$('gdt').textContent=a*b*k+' รอบ';$('gdx').textContent=`${a} × ${b} × ${k} = ${a*b*k}`};['gda','gdb','gdk'].forEach(i=>$(i).oninput=up);up()}},
pca:{h:'PCA: หาแกนที่ข้อมูลกระจายมากที่สุด',s:'หมุนแกน (เส้นม่วง) แล้วดูว่าเมื่อฉายจุดทั้งหมดลงบนแกน จุดที่ฉายแล้ว (สีส้ม) กระจายกว้างแค่ไหน แกนที่กระจายกว้างที่สุดคือแกน PCA ที่ 1 ใช้ลดจาก 2 มิติเหลือ 1 มิติโดยเสียข้อมูลน้อยที่สุด',
html:`${sld('pca','มุมของแกน (องศา)',0,180,1,100,150)}<svg id="pcs" width="100%" viewBox="0 0 680 300" role="img" aria-label="PCA"></svg><div class="rw"><div class="st"><span>ความกระจายตามแกนนี้</span><b id="pcv"></b></div><button id="pcb">หาแกน PCA ให้</button></div>`,
init(){const r=rng(17),P=[...Array(60)].map(()=>{const u=gau(r)*1.5,v=gau(r)*0.4,t=0.5;return[u*Math.cos(t)-v*Math.sin(t),u*Math.sin(t)+v*Math.cos(t)]});const mx=P.reduce((s,p)=>s+p[0],0)/60,my=P.reduce((s,p)=>s+p[1],0)/60,Q=P.map(p=>[p[0]-mx,p[1]-my]);const sxx=Q.reduce((s,p)=>s+p[0]*p[0],0),syy=Q.reduce((s,p)=>s+p[1]*p[1],0),sxy=Q.reduce((s,p)=>s+p[0]*p[1],0),best=((0.5*Math.atan2(2*sxy,sxx-syy))*180/Math.PI+180)%180;
const X=x=>340+x*60,Y=y=>150-y*60,vr=deg=>{const t=deg*Math.PI/180;return Q.reduce((s,p)=>s+(p[0]*Math.cos(t)+p[1]*Math.sin(t))**2,0)/60};
const up=()=>{const deg=+$('pca').value;$('pcav').textContent=deg;const t=deg*Math.PI/180,ux=Math.cos(t),uy=Math.sin(t);let s=`<line x1="${X(-5*ux).toFixed(1)}" y1="${Y(-5*uy).toFixed(1)}" x2="${X(5*ux).toFixed(1)}" y2="${Y(5*uy).toFixed(1)}" stroke="${C.v}" stroke-width="2.5"/>`;Q.forEach(p=>{const d=p[0]*ux+p[1]*uy,px=d*ux,py=d*uy;s+=`<line x1="${X(p[0]).toFixed(1)}" y1="${Y(p[1]).toFixed(1)}" x2="${X(px).toFixed(1)}" y2="${Y(py).toFixed(1)}" stroke="${C.gr}" stroke-width="0.5" opacity="0.6"/>`+dot(X(p[0]).toFixed(1),Y(p[1]).toFixed(1),4,C.b)+dot(X(px).toFixed(1),Y(py).toFixed(1),3,C.o)});$('pcs').innerHTML=s;$('pcv').textContent=vr(deg).toFixed(2)+' (สูงสุด '+vr(best).toFixed(2)+')'};$('pca').oninput=up;$('pcb').onclick=()=>{$('pca').value=Math.round(best);up()};up()}},
dendro:{h:'Hierarchical clustering: แผนภาพต้นไม้ (dendrogram)',s:'อ่านจากล่างขึ้นบน: จุดที่คล้ายกันที่สุดถูกรวมกันก่อน (agglomerative) อ่านจากบนลงล่าง: แบ่งกลุ่มใหญ่ลงมาเรื่อย ๆ (divisive) ลากเส้นตัดที่ระดับไหน ก็ได้จำนวนกลุ่มเท่ากับจำนวนเส้นที่ตัดผ่าน',
html:(()=>{const pl=(pts,c)=>`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="2"/>`;let s=pl([[120,250],[120,220],[200,220],[200,250]],C.b)+pl([[160,220],[160,170],[290,170],[290,250]],C.b)+pl([[390,250],[390,210],[470,210],[470,250]],C.o)+pl([[430,210],[430,160],[560,160],[560,250]],C.o)+pl([[225,170],[225,80],[495,80],[495,160]],C.gr)+`<line x1="90" y1="125" x2="600" y2="125" stroke="${C.r}" stroke-width="1.5" stroke-dasharray="6 4"/>`+tx(92,141,'ตัดตรงนี้ได้ 2 กลุ่ม');[['A',120],['B',200],['C',290],['D',390],['E',470],['F',560]].forEach(([k,x])=>s+=tx(x,266,k,'th','middle'));return svg(280,s,'dendrogram')})()},
elbow:{h:'Elbow method: เลือกจำนวนกลุ่ม k',s:'แกนนอนคือจำนวนกลุ่ม k แกนตั้งคือความกระจายภายในกลุ่ม (inertia) เพิ่ม k แล้วค่าลดลงเสมอ แต่หลังจุด "ข้อศอก" ลดลงน้อยมาก จึงเลือก k ที่ข้อศอก',
html:`<svg id="elb" width="100%" role="img" aria-label="elbow"></svg>`,
init(){const v=[100,55,25,20,17,15,14,13],H=215;plot($('elb'),[{pts:v.map((y,i)=>[i+1,y]),c:C.b,line:1,dot:1,r:4}],{x0:1,x1:8,y0:0,y1:110,h:H});const sx=k=>16+(k-1)/7*608,sy=y=>H-16-y/110*(H-32);$('elb').innerHTML+=`<circle cx="${sx(3)}" cy="${sy(25)}" r="10" fill="none" stroke="${C.o}" stroke-width="2.5"/>`+tx(sx(3)+18,sy(25)-20,'ข้อศอก: k = 3','th')+v.map((y,i)=>tx(sx(i+1),H-6,'k='+(i+1),'ts','middle')).join('')}},
mf:{h:'Matrix factorization: แยกตารางใหญ่เป็นตารางเล็กสองตาราง',s:'จำนวนหัวข้อ |T| น้อยกว่าจำนวนคำ |V| มาก ตาราง B กับ C รวมกันจึงเล็กกว่า A แต่คูณกันแล้วประมาณค่า A ได้',

tsparts:{h:'แยก time series เป็น 3 ส่วน',s:'ข้อมูลจริง (กราฟล่างสุด) คือ trend + seasonal + residual บวกกัน',
html:['tp1|Trend: แนวโน้มระยะยาว','tp2|Seasonal: รูปแบบที่ซ้ำเป็นรอบ (ทุก 12 จุด)','tp3|Residual: ส่วนที่เหลือแบบสุ่ม','tp4|รวมกัน = ข้อมูลจริงที่เราเห็น'].map(a=>{const[i,l]=a.split('|');return `<p class="s" style="margin:8px 0 0">${l}</p><svg id="${i}" width="100%" role="img" aria-label="${l}"></svg>`}).join(''),
init(){const r=rng(2),n=60,T=[...Array(n)].map((_,t)=>10+0.15*t),S=[...Array(n)].map((_,t)=>3*Math.sin(2*Math.PI*t/12)),R=[...Array(n)].map(()=>gau(r)*0.8),Y=T.map((v,i)=>v+S[i]+R[i]);[[T,C.v],[S,C.t],[R,C.gr],[Y,C.b]].forEach(([a,c],k)=>{const lo=Math.min(...a),hi=Math.max(...a),pd=(hi-lo)*0.15||1;plot($('tp'+(k+1)),[{pts:a.map((v,t)=>[t,v]),c,line:1,w:k===3?2.2:1.8}],{x0:0,x1:n-1,y0:lo-pd,y1:hi+pd,h:70})})}},
addmul:{h:'Additive กับ Multiplicative',s:'ซ้าย: แกว่งกว้างเท่าเดิมตลอด (additive) ขวา: ยิ่งค่าสูง ยิ่งแกว่งกว้าง (multiplicative)',
html:`<div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:12px"><div><p class="s" style="margin:0">Additive: Y = T + S + R</p><svg id="am1" width="100%" role="img" aria-label="additive"></svg></div><div><p class="s" style="margin:0">Multiplicative: Y = T × S × R</p><svg id="am2" width="100%" role="img" aria-label="multiplicative"></svg></div></div>`,
init(){const n=72,a=[...Array(n)].map((_,t)=>[t,10+0.4*t+3*Math.sin(2*Math.PI*t/12)]),m=[...Array(n)].map((_,t)=>[t,(10+0.4*t)*(1+0.3*Math.sin(2*Math.PI*t/12))]);plot($('am1'),[{pts:a,c:C.b,line:1,w:3.5}],{x0:0,x1:n-1,y0:0,y1:52,h:280});plot($('am2'),[{pts:m,c:C.o,line:1,w:3.5}],{x0:0,x1:n-1,y0:0,y1:52,h:280})}},
arma:{h:'AR กับ MA ดึงข้อมูลจากไหนมาทาย',s:'เส้นม่วง (AR) ใช้ค่าจริงในอดีต เส้นส้มประ (MA) ใช้ความผิดพลาดของการทายครั้งก่อน ๆ ARIMA ใช้ทั้งสองอย่าง และทำ differencing ก่อน',
html:svg(300,['y(t−1)','y(t−2)','y(t−3)'].map((l,i)=>box(30,20+i*50,130,40,'purple',l)+`<line x1="160" y1="${40+i*50}" x2="466" y2="${138+i*4}" stroke="${C.v}" stroke-width="2" marker-end="url(#arrow)"/>`).join('')+['ε(t−1)','ε(t−2)'].map((l,i)=>box(30,190+i*50,130,40,'coral',l)+`<line x1="160" y1="${210+i*50}" x2="466" y2="${158+i*4}" stroke="${C.o}" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>`).join('')+box(470,120,160,56,'teal','y(t)','ค่าที่ต้องการทาย')+tx(290,58,'AR: ใช้ค่าในอดีต')+tx(290,266,'MA: ใช้ error ของการทายก่อนหน้า'),'AR และ MA')},
tsplit:{h:'แบ่ง train / test ของ time series',s:'สีม่วงคือ train สีส้มคือ test ต้องเอาช่วงท้ายสุดเป็น test เท่านั้น',
html:(()=>{let s=tx(20,40,'ถูก: แบ่งตามเวลา','th')+tx(20,100,'ผิด: สุ่มแบ่ง','th');const bad=[3,7,11,14,19,22];for(let i=0;i<24;i++){const x=150+i*20;s+=`<rect x="${x}" y="28" width="18" height="24" rx="3" fill="${i>=18?C.o:C.v}" opacity="${i>=18?0.9:0.55}"/><rect x="${x}" y="88" width="18" height="24" rx="3" fill="${bad.includes(i)?C.o:C.v}" opacity="${bad.includes(i)?0.9:0.55}"/>`}s+=ar(150,140,628,140)+tx(150,156,'อดีต')+tx(628,156,'ปัจจุบัน','ts','end')+tx(390,126,'test ปนอยู่ในอดีต = เอาอนาคตไปช่วยทายอดีต','ts','middle');return svg(166,s,'การแบ่งข้อมูลตามเวลา')})()},
ci:{h:'Confidence interval: ยิ่งมั่นใจ ช่วงยิ่งกว้าง',s:'เส้นน้ำเงินคือข้อมูลจริงในอดีต เส้นประม่วงคือค่าที่พยากรณ์ แถบสีคือช่วงความเชื่อมั่น ยิ่งพยากรณ์ไกล ช่วงยิ่งกว้าง ลองปรับ % ความเชื่อมั่น',
html:`${sld('cic','ความเชื่อมั่น (%)',50,99,1,90,150)}<svg id="cis" width="100%" viewBox="0 0 680 220" role="img" aria-label="confidence interval"></svg><div class="rw"><div class="st"><span>ค่า z</span><b id="ciz"></b></div><span class="pill a" id="cit"></span></div>`,
init(){const r=rng(13),Hs=[...Array(36)].map((_,t)=>20+0.2*t+3*Math.sin(2*Math.PI*t/12)+gau(r)*0.8),Fc=[...Array(13)].map((_,h)=>{const t=35+h;return 20+0.2*t+3*Math.sin(2*Math.PI*t/12)});const ei=x=>{const a=0.147,ln=Math.log(1-x*x),t=2/(Math.PI*a)+ln/2;return Math.sign(x)*Math.sqrt(Math.sqrt(t*t-ln/a)-t)};const X=t=>20+t*13.3,Y=v=>205-(v-5)*4.2;
const up=()=>{const c=+$('cic').value;$('cicv').textContent=c;const z=Math.SQRT2*ei(c/100),hi=Fc.map((v,h)=>[35+h,v+z*1.2*Math.sqrt(h)]),lo=Fc.map((v,h)=>[35+h,v-z*1.2*Math.sqrt(h)]).reverse(),pp=a=>a.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');
$('cis').innerHTML=`<polygon points="${pp(hi)} ${pp(lo)}" fill="${C.v}" opacity="0.18"/><polyline points="${pp(Hs.map((v,t)=>[t,v]))}" fill="none" stroke="${C.b}" stroke-width="2"/><polyline points="${pp(Fc.map((v,h)=>[35+h,v]))}" fill="none" stroke="${C.v}" stroke-width="2" stroke-dasharray="6 4"/><line x1="${X(35)}" y1="10" x2="${X(35)}" y2="208" stroke="var(--border-strong)" stroke-dasharray="3 3"/>`+tx(X(35)-6,16,'อดีต','ts','end')+tx(X(35)+6,16,'อนาคต (พยากรณ์)');$('ciz').textContent=z.toFixed(3);$('cit').textContent=`ช่วง = ค่าที่ทาย ± ${z.toFixed(2)} × σ`};$('cic').oninput=up;up()}},
prec:{h:'Python คำนวณทีละขั้นตามลำดับ precedence',s:'เลือกโจทย์แล้วกดถัดไป ส่วนที่ไฮไลต์คือส่วนที่ Python คำนวณในขั้นนั้น',
html:`<div class="rw"><select id="prs"><option value="0">5 + 1 ** 2 / 2</option><option value="1">4 + - 1 * 4 / 2 ** 2</option><option value="2">not not (3 &gt; 5) == True</option></select><button id="prb"><i class="ti ti-arrow-left" aria-hidden="true"></i> ย้อน</button><button id="prn">ถัดไป <i class="ti ti-arrow-right" aria-hidden="true"></i></button><span class="s" id="prc" style="margin:0"></span></div><div id="prx" class="mono" style="font-size:20px;padding:14px;background:var(--bg-neutral);border-radius:var(--radius);margin:8px 0;text-align:center"></div><p class="ex" id="pre" style="margin:0"></p>`,
init(){const E=[[['5 + [1 ** 2] / 2','ขั้นแรกทำ ** (ยกกำลัง) ก่อนทุกอย่าง: 1 ** 2 = 1'],['5 + [1 / 2]','ต่อด้วยการหาร: 1 / 2 = 0.5 (หารด้วย / ได้ทศนิยมเสมอ)'],['[5 + 0.5]','บวกทำทีหลังสุด'],['5.5','คำตอบสุดท้าย']],[['4 + - 1 * 4 / [2 ** 2]','ทำ ** ก่อน: 2 ** 2 = 4'],['4 + [- 1] * 4 / 4','เครื่องหมายลบหน้าตัวเลข (unary minus) ทำก่อนคูณหาร: ได้ −1'],['4 + [-1 * 4] / 4','คูณกับหารมีลำดับเท่ากัน ทำจากซ้ายไปขวา: −1 × 4 = −4'],['4 + [-4 / 4]','−4 / 4 = −1.0'],['[4 + -1.0]','สุดท้ายทำบวก'],['3.0','คำตอบสุดท้าย เป็น float เพราะมีการหารด้วย /']],[['not not [(3 &gt; 5)] == True','ในวงเล็บก่อน: 3 > 5 เป็นเท็จ ได้ False'],['not not [False == True]','== ทำก่อน not: False == True ได้ False'],['not [not False]','not False ได้ True'],['[not True]','not True ได้ False'],['False','คำตอบสุดท้าย']]];let e=0,k=0;
const up=()=>{const st=E[e][k];$('prx').innerHTML=st[0].replace(/\[/g,'<span class="hl2">').replace(/\]/g,'</span>');$('pre').textContent=st[1];$('prc').textContent='ขั้นที่ '+(k+1)+' จาก '+E[e].length};$('prs').onchange=()=>{e=+$('prs').value;k=0;up()};$('prn').onclick=()=>{if(k<E[e].length-1)k++;up()};$('prb').onclick=()=>{if(k>0)k--;up()};up()}},

['p','AI (Artificial Intelligence) แปลว่าปัญญาประดิษฐ์ หรือ "ความฉลาดที่มนุษย์สร้างขึ้น" ปัญหาคือคำว่า "ความฉลาด" แต่ละคนเข้าใจไม่เหมือนกัน จึงมีนิยามหลายแบบ ข้อสอบถามว่าคำไหนตีความต่างกันมากที่สุด คำตอบคือ ความฉลาด (Intelligence)'],
['p','นิยามที่อาจารย์ในวิดีโอชอบมาจาก Elaine Rich และ Kevin Knight (ปี 1991): AI คือการศึกษาวิธีทำให้คอมพิวเตอร์ทำสิ่งที่ "ตอนนี้" คนยังทำได้ดีกว่า เช่น เมื่อก่อนคอมพิวเตอร์จำหน้าคนไม่ได้ ตอนนี้ทำได้แล้ว งานที่ AI ต้องไล่ตามจึงเปลี่ยนไปเรื่อย ๆ'],
['h','นิยาม 4 กลุ่ม'],
['p','หนังสือ AI: A Modern Approach ของ Russell และ Norvig แบ่งนิยาม AI เป็น 4 กลุ่ม โดยถามสองคำถาม คือ อยากให้เครื่อง "คิด" หรือ "ทำ" และอยากให้เหมือน "มนุษย์" หรือให้ "มีเหตุผล" กดแต่ละช่องในตารางเพื่อดูความหมาย'],
['lab','quad'],
['def',[['Strong AI','ต้องการให้เครื่อง "คิด" เหมือนสมองมนุษย์จริง ๆ ตรงกับกลุ่ม Think like human',''],['Weak AI','ขอแค่ให้เครื่อง "ทำ" ได้ผลเหมือนมนุษย์ ตรงกับกลุ่ม Act like human','เครื่องบินบินได้โดยไม่ต้องกระพือปีก'],['Rational (มีเหตุผล)','ใช้หลักตรรกะที่อธิบายได้','ฝนตก จึงพื้นเปียก']]],
['h','Turing test'],
['p','Turing test เป็นตัวอย่างของกลุ่ม "ทำเหมือนมนุษย์" กดดูวิธีทดสอบทีละขั้น'],
['steps',{t:'Turing test ทำอย่างไร',i:[['แยกห้อง','ห้องหนึ่งมีคนจริง (A) และคอมพิวเตอร์ (B) อีกห้องมีผู้ประเมินที่มองไม่เห็นว่าใครเป็นใคร'],['ถามผ่านข้อความ','ผู้ประเมินพิมพ์คำถามอะไรก็ได้ส่งไปให้ A และ B'],['A และ B ตอบ','คอมพิวเตอร์พยายามตอบให้เหมือนคนที่สุด และต้องจำได้ว่าตัวเองเคยตอบอะไรไป'],['ตัดสิน','ถ้าผู้ประเมินแยกไม่ออกว่าใครคือคอมพิวเตอร์ ถือว่าคอมพิวเตอร์ผ่าน การทดสอบนี้จึงวัด "การเลียนแบบมนุษย์ด้านการสื่อสาร"']]}],
['h','Chinese room'],
['p','คนที่ไม่รู้ภาษาจีนนั่งในห้องที่มีคู่มือ เมื่อได้รับคำถามภาษาจีนก็เปิดคู่มือจับคู่หาคำตอบส่งออกไป คนข้างนอกนึกว่าเขาเข้าใจภาษาจีน แสดงว่าเครื่องสามารถ "ทำเหมือนเข้าใจ" ได้โดยไม่ต้องเข้าใจจริง (เป็นตัวอย่างของกลุ่ม Act like human เช่นกัน)'],
['p','ข้อได้เปรียบที่ AI มีเหนือคนแน่ ๆ ในตอนนี้คือ คำนวณคณิตศาสตร์ได้ดีกว่า']],
tips:['Turing test เกี่ยวกับ "การเลียนแบบมนุษย์ด้านการสื่อสาร" (ไม่ใช่ภาษาจีน ไม่ใช่การรู้จำภาพ)','คำที่ตีความต่างกันมากที่สุดในนิยาม AI คือ "ความฉลาด"','Strong AI คือ Think like human ส่วน Weak AI คือ Act like human','ข้อได้เปรียบของ AI ที่มีมากกว่ามนุษย์คือ คำนวณคณิตศาสตร์ได้ดีกว่า'],
q:[['การทดสอบทัวริง (Turing Test) เกี่ยวข้องกับข้อใดมากที่สุด',['ภาษาจีน','การเรียนรู้แบบเสริมแรง','การรู้จำรูปภาพตัวอักษร','การเลียนแบบมนุษย์ด้านการสื่อสาร'],3,''],['ข้อใดเป็นคำที่ตีความได้แตกต่างกันมากที่สุดในคำนิยามของ AI',['เวลา','มนุษย์','ความฉลาด','เครื่องคอมพิวเตอร์'],2,''],['Strong AI ตรงกับกลุ่มใด',['Think like human','Act like human','Act rationally','Think rationally'],0,''],['ข้อได้เปรียบของ AI ที่มีมากกว่ามนุษย์คือข้อใด',['เข้าใจมนุษย์มากกว่ามนุษย์ด้วยกัน','คำนวณทางคณิตศาสตร์ได้ดีกว่า','ค้นหาคำตอบได้หลากหลายกว่า','เข้าใจภาพและเสียงละเอียดกว่า'],1,'']]},
{t:'AI แก้ปัญหาอย่างไร: state, การค้นหา และ heuristic',goal:'รู้ตัวอย่างการใช้ AI รู้จัก fuzzy logic และเข้าใจการแก้ปัญหาด้วยการค้นหา (BFS, DFS, heuristic)',b:[
['h','AI อยู่รอบตัวเรา'],
['p','ตัวอย่างจากวิดีโอ: กล้องตรวจว่าใส่หน้ากากไหมและวัดอุณหภูมิ, กล้องอ่านป้ายทะเบียน, นับรถเพื่อปรับไฟจราจร, แอปนำทางที่สั่งด้วยเสียง, รถไร้คนขับ ส่วน "ค้นประวัติคนไข้จากรหัสแท่ง (บาร์โค้ด)" ไม่ใช่ AI เพราะแค่เปิดข้อมูลตามรหัส ไม่มีการคิดหรือเรียนรู้'],
['h','Fuzzy logic'],
['p','ระบบแอร์ยุคแรกใช้ fuzzy logic คือการไม่แบ่งกลุ่มแบบเด็ดขาด ถ้าตั้งว่าสูง 180 ซม. ขึ้นไปคือ "คนสูง" คนสูง 179 ซม. จะกลายเป็น "ไม่สูง" ทันทีทั้งที่ต่างกันแค่ 1 ซม. fuzzy logic จึงให้เป็น "ระดับ" แทน (คำว่า fuzzy ในที่นี้ไม่ได้แปลว่าคลุมเครือ) ลองเลื่อนความสูงในกราฟ'],
['fig','fuzzy'],
['h','ปัญหาแบบ AI: state และ state space'],
['p','ปัญหาแบบ AI มีโครงสร้างเหมือนเล่นเกม: เริ่มจากสถานะตอนนี้ ทำการกระทำแล้วได้สถานะใหม่ ทำไปเรื่อย ๆ จนถึงเป้าหมาย'],
['def',[['State','สภาพของปัญหา ณ ตอนนี้','หน้าตารูบิกตอนนี้'],['Action','สิ่งที่ทำแล้ว state เปลี่ยน','หมุนรูบิก 1 ครั้ง'],['Goal state','สถานะที่ต้องการไปให้ถึง','รูบิกเรียงสีครบ'],['State space','state ที่เป็นไปได้ทั้งหมดของปัญหา','ทุกหน้าตาที่รูบิกเป็นได้']]],
['p','ตัวอย่างในวิดีโอคือเกม 8-Puzzle: กระดาน 3×3 มีแผ่นเลข 8 แผ่นกับช่องว่าง 1 ช่อง ในโปรแกรมนิยมคิดว่า "ย้ายช่องว่าง" ช่องว่างอยู่ตรงไหนจะย้ายได้ไม่เท่ากัน ลองกดดู'],
['fig','puzzle'],
['f',['8-Puzzle: ช่องว่างตรงกลางเลื่อนได้ 4 ทาง, ริมขอบ 3 ทาง, มุม 2 ทาง','จำนวนทางขึ้นกับว่าช่องว่างติดกับแผ่นกี่ด้าน','ช่องว่างอยู่มุมบนซ้าย เลื่อนได้แค่ไปขวากับลงล่าง จึงได้ 2 ทาง']],
['h','ขั้นตอนแก้ปัญหาด้วยการค้นหา'],
['steps',{t:'กดทีละขั้น',i:[['กำหนด state เริ่มต้น','บอกว่าตอนนี้ปัญหาอยู่ในสภาพไหน เช่น กระดาน 8-Puzzle ที่ยังสลับอยู่'],['กำหนด action','บอกว่าทำอะไรได้บ้าง เช่น ย้ายช่องว่างขึ้น ลง ซ้าย ขวา'],['กำหนด goal','บอกว่าสภาพแบบไหนคือสำเร็จ เช่น เลข 1 ถึง 8 เรียงครบ'],['ค้นหา','ลองทำ action ไปเรื่อย ๆ ใน state space ด้วย BFS หรือ DFS หรือใช้ heuristic ช่วยเลือกทาง'],['ได้คำตอบ','ได้ลำดับ action ที่พาจาก state เริ่มต้นไปถึง goal']]}],
['h','BFS กับ DFS'],
['p','BFS (Breadth-First Search) ค้น "กว้างก่อน" ลองทุกทางในชั้นที่ 1 ให้ครบก่อนค่อยไปชั้นที่ 2 ต้องจำทางที่รอค้นไว้เยอะมาก จึงกินหน่วยความจำ'],
['p','DFS (Depth-First Search) ค้น "ลึกก่อน" เดินทางเดียวลงไปจนสุดก่อนค่อยถอยกลับ ใช้หน่วยความจำน้อย แต่ถ้าเป้าหมายอยู่อีกกิ่งจะเสียเวลามาก (อาจารย์บอกว่าอาจนานเป็นล้านปี) ลองเทียบสองแบบในแล็บ'],
['lab','search'],
['f',['จำนวนโหนดในชั้นที่ d ≈ bᵈ','b คือจำนวนทางที่แตกได้แต่ละครั้ง, d คือจำนวนก้าว BFS ต้องจำทั้งชั้นนี้ไว้','แตกได้ 3 ทาง ลึก 10 ก้าว ได้ 3¹⁰ ≈ 59,000 โหนด']],
['h','Heuristic function'],
['p','Heuristic function คือตัวประเมินว่า state ไหน "น่าจะใกล้เป้าหมาย" เพื่อเลือกทางที่ดีโดยไม่ต้องลองทุกทาง เช่น หาเส้นทางขับรถ ให้เลือกเมืองถัดไปที่ระยะเส้นตรงถึงปลายทางสั้นที่สุด หรือใน 8-Puzzle ให้นับว่ายังมีกี่แผ่นที่วางผิดที่']],
tips:['ปัญหาของ DFS คือ "เวลาที่ใช้ค้นหา" ส่วนปัญหาของ BFS คือหน่วยความจำ','8-Puzzle ไม่เกี่ยวกับ "การเข้าใจภาษาธรรมชาติ"','"ค้นหาประวัติคนไข้จากรหัสแท่ง" ไม่ใช่การประยุกต์ใช้ AI'],
q:[['ข้อใดคือปัญหาของการค้นหาแบบ Depth First Search',['เวลาที่ใช้ค้นหา','หน่วยความจำที่ต้องใช้','สถานะคำตอบใกล้สถานะเดิมเกินไป','วิธีประเมินความดีของคำตอบยุ่งยาก'],0,''],['ข้อใดไม่ใช่ตัวอย่างการประยุกต์ใช้ AI',['การตอบโต้ผ่านแชตบอต','การค้นหารูปภาพด้วยรูปภาพ','การค้นหาประวัติคนไข้จากรหัสแท่ง','การค้นหาเส้นทางที่เร็วที่สุด'],2,''],['การหาวิธีเลื่อนแผ่นในเกม 8-Puzzle ไม่เกี่ยวข้องกับข้อใด',['การเข้าใจภาษาธรรมชาติ','การกำหนดสถานะของปัญหา','การใช้เหตุผลด้วยตรรกศาสตร์','การค้นหาใน state space'],0,'']]},
{t:'Machine learning: 3 ประเภท โมเดลที่ควรรู้ และการหาเส้นที่ดีที่สุด',goal:'แยก ML 3 ประเภทได้ รู้จัก neural network และ decision tree และเข้าใจว่าคอมพิวเตอร์ "เรียน" โดยลด error อย่างไร',b:[
['h','ML มี 3 ประเภท'],
['p','แบ่งตามว่าข้อมูล "มีเฉลยไหม" ดูภาพแล้วอ่านความหมายด้านล่าง'],
['fig','ml3types'],
['def',[['Supervised learning','เรียนจากข้อมูลที่มีคำตอบ (target) เหมือนทำแบบฝึกหัดที่มีเฉลย','ทายราคาบ้าน, คัดสแปม'],['Unsupervised learning','ข้อมูลไม่มีคำตอบ ให้คอมพิวเตอร์จับกลุ่มของที่คล้ายกันเอง เรียกว่า clustering','แบ่งกลุ่มลูกค้า'],['Reinforcement learning','ลองทำทีละขั้น พอรู้ผลตอนจบจึงย้อนไปให้รางวัลกับลำดับการกระทำที่ดี ใช้กับงานควบคุม','หุ่นยนต์, เกม']]],
['h','Neural network'],
['p','Neural network (โครงข่ายประสาทเทียม) เลียนแบบเซลล์ประสาท ประกอบด้วยโหนดที่ต่อกันเป็นชั้น ๆ เหมือนตาข่าย ข้อมูลเข้าทางซ้ายแล้วไหลผ่านเส้นเชื่อมไปทางขวาจนได้คำตอบ ลองเลื่อนค่าและเพิ่มชั้นดู'],
['fig','nn'],
['p','ถ้าซ้อน hidden layer หลายชั้นเรียกว่า Deep learning และ neural network ชนิดที่เหมาะกับรูปภาพเรียกว่า CNN'],
['h','Decision tree'],
['p','Decision tree (ต้นไม้ตัดสินใจ) ถามคำถามใช่หรือไม่ใช่ไปทีละข้อจนได้คำตอบ ข้อดีคือคนอ่านแล้วเข้าใจได้ง่ายว่าทำไมได้คำตอบนั้น และสร้างได้เร็วแม้ข้อมูลเยอะ ใช้วิเคราะห์ เช่น ลูกค้าจะเลิกใช้บริการไหม พนักงานจะลาออกไหม ลองปรับข้อมูลแล้วดูเส้นทาง'],
['fig','tree'],
['h','ตัวอย่างที่ง่ายที่สุด: ลากเส้นตรง'],
['p','ถ้ามีจุดข้อมูลหลายจุดแล้วอยากลากเส้นตรงผ่าน เส้นจะผ่านไม่ครบทุกจุด ระยะห่างระหว่างจุดกับเส้นคือ error งานของคอมพิวเตอร์คือหาเส้นที่ทำให้ error รวมน้อยที่สุด เริ่มจากสมการเส้นตรง'],
['f',['y = mx + c','x คือข้อมูลเข้า, y คือค่าที่ทาย, m คือความชัน (x เพิ่ม 1 แล้ว y เพิ่มเท่าไร), c คือจุดที่เส้นตัดแกน y','m = 2, c = 1, x = 3 ได้ y = 2 × 3 + 1 = 7']],
['p','แล้ววัดว่าเส้นนั้นผิดรวมเท่าไรด้วยสูตรนี้'],
['f',['E = ½ Σ (target − output)²','target คือคำตอบจริง, output คือค่าที่ทาย, Σ แปลว่าบวกทุกตัวอย่าง ต้องยกกำลังสองเพื่อให้ error เป็นบวกเสมอ (ไม่งั้น +1 กับ −1 หักล้างกันเหลือ 0) ส่วน ½ ใส่ไว้ให้คำนวณต่อง่าย','จริง 5 และ 3 ทายได้ 4 และ 5 → error คือ 1 และ −2 → E = ½ × (1 + 4) = 2.5']],

{k:'ts',name:'Time series',n:8,intro:'ข้อมูลที่เรียงตามเวลา ควรเรียนหัวข้อ AI และ ML กับ Supervised ก่อน',mods:[
{t:'Time series, ส่วนประกอบ และ Stationary',goal:'รู้ว่าอะไรคือ time series แยกส่วนประกอบ 3 ส่วนได้ และรู้ขั้นตอนทำข้อมูลให้ stationary',b:[
['h','Time series คืออะไร'],
['p','Time series (อนุกรมเวลา) คือข้อมูลที่เก็บเรียงตามเวลา เช่น ปริมาณฝนรายวัน ราคาหุ้นรายวัน อุณหภูมิรายปี ส่วน "ค่าไฟของทุกห้องในคอนโดเดือนมกราคม" ไม่ใช่ time series เพราะเป็นข้อมูลหลายห้องในเวลาเดียว ไม่ได้ดูการเปลี่ยนแปลงตามเวลา'],
['def',[['Univariate','ดูตัวแปรเดียวตามเวลา','ยอดขายรายวันของร้านเดียว'],['Multivariate','ดูหลายตัวแปรพร้อมกัน','ผู้ป่วย COVID รายวันของหลายประเทศในกราฟเดียว']]],
['h','3 ส่วนประกอบ'],
['p','Time series แยกได้เป็น 3 ส่วน (decomposition) ดูภาพว่าเมื่อบวกสามส่วนเข้าด้วยกันแล้วได้ข้อมูลจริง'],
['fig','tsparts'],
['def',[['Trend','แนวโน้มระยะยาว ขึ้นหรือลงเรื่อย ๆ',''],['Seasonal','รูปแบบที่ซ้ำเป็นรอบ (มีหลายรอบซ้อนกันได้ เช่น รายสัปดาห์และรายปี)','ยอดขายสูงทุกธันวาคม'],['Residual','ส่วนที่เหลือแบบสุ่ม','']]],
['p','ฟังก์ชัน seasonal_decompose ใน library statsmodels แยกให้ได้ อ่านผลโดย: เส้นเรียบคือ trend เส้นที่แกว่งเป็นจังหวะคือ seasonal เส้นที่สั่นมั่วคือ residual'],
['h','Additive กับ Multiplicative'],
['p','การรวมสามส่วนมี 2 แบบ ดูจากว่าการแกว่งกว้างขึ้นไหม'],
['fig','addmul'],
['f',['Additive: Y = T + S + R','T คือ trend, S คือ seasonal, R คือ residual ใช้เมื่อแกว่งด้วยขนาดคงที่','']],
['f',['Multiplicative: Y = T × S × R','ใช้เมื่อแกว่งกว้างขึ้นตามระดับข้อมูล ใส่ log แล้วจะกลายเป็น log(Y) = log(T) + log(S) + log(R) คือแบบ additive','']],

['def',[['Lag','ระยะย้อนหลัง','lag 1 คือก่อนหน้า 1 ช่วง, lag 12 คือ 12 ช่วงก่อน'],['Autocorrelation (ACF)','ความสัมพันธ์ระหว่างค่าตอนนี้กับค่าในอดีต',''],['ADF test','การทดสอบทางสถิติว่า stationary หรือไม่',''],['p-value','ตัวเลขทางสถิติ ถ้าน้อยกว่า 0.05 ถือว่าผลมีนัยสำคัญ','']]],

['lab','decomp'],
['f',['Differencing: yₜ − yₜ₋₁','yₜ คือค่า ณ เวลา t, yₜ₋₁ คือค่าก่อนหน้า 1 ช่วง ใช้ตัด trend','ข้อมูล 10, 12, 15 → หลัง differencing ได้ 2, 3']],
['f',['Seasonal differencing: yₜ − yₜ₋ₘ','m คือความยาวของรอบ ใช้ตัด seasonal (ในควิซใช้ m = 6)','']],
['f',['ADF test: p-value &lt; 0.05 แปลว่า stationary','สมมติฐานตั้งต้นของ ADF คือ "ไม่ stationary" ถ้า p น้อยจึงปฏิเสธสมมติฐานนั้นได้','p = 0.005 หรือ 0.01 → stationary']],
['p','หลักฐานที่บอกว่า stationary มี 4 อย่าง: ค่าเฉลี่ยเคลื่อนที่คงที่, ไม่มี seasonal, ADF test ได้ p-value น้อยกว่า 0.05 และ autocorrelation ตั้งแต่ lag 1 ขึ้นไปไม่มีนัยสำคัญ']],
tips:['ค่าไฟทุกห้องในเดือนเดียว ไม่ใช่ time series','แกว่งกว้างขึ้นตามระดับข้อมูล คือ multiplicative','Stationary: แบ่งเป็นสองครึ่งแล้ว variance เท่ากัน','มี trend และ seasonal คาบ 6 (additive): ใช้ differencing และ seasonal differencing คาบ 6 ไม่ต้อง log','ข้อความที่ผิด: "Trend บอกความสัมพันธ์ระหว่างเวลาปัจจุบันกับเวลาก่อนหน้า" (นั่นคือ autocorrelation)'],
q:[['ข้อใดไม่ใช่ time series',['ปริมาณน้ำฝนรายวันในปี 2020','ค่าไฟฟ้าของห้องทุกห้องในคอนโดเดือนมกราคม 2020','ราคาหุ้นรายวัน','อุณหภูมิเฉลี่ยรายปี 1950–2000'],1,''],['Time series ที่ seasonal แกว่งกว้างขึ้นตามระดับข้อมูล เป็นประเภทใด',['Additive','Multiplicative','Pseudo-additive'],1,''],['ข้อใดกล่าวถูกต้องที่สุดเกี่ยวกับ stationary',['ไม่มี seasonal แต่มี trend ได้','variance ต่ำกว่า non-stationary','แบ่งเป็นสองส่วนแล้ว variance ของสองครึ่งเท่ากัน','วิเคราะห์ยากกว่า non-stationary'],2,''],['ข้อมูลมี trend และ seasonal คาบ 6 ต้องทำอะไรให้เป็น stationary',['differencing อย่างเดียว','differencing และ seasonal differencing คาบ 6','ต้อง log ด้วยทุกครั้ง','ทำไม่ได้'],1,''],['ADF test ได้ p-value = 0.01 ควรสรุปว่า',['Stationary','Non-stationary','มี seasonal','ต้อง log'],0,'']]},

q:[['หน่วยความจำแบบใดเก็บข้อมูลได้แม้ไม่มีไฟเลี้ยง',['RAM','Disk','Cache','CPU'],1,''],['Device driver มีหน้าที่อะไร',['จัดสรรทรัพยากรให้ซอฟต์แวร์','ตรวจสอบฮาร์ดแวร์เมื่อเปิดเครื่อง','ควบคุมอุปกรณ์ต่อพ่วงโดยทำงานร่วมกับระบบปฏิบัติการ','จำลองการทำงานของอุปกรณ์'],2,''],['ภาษาแอสเซมบลีคืออะไร',['ภาษาที่เทียบเท่าภาษาเครื่อง แต่เขียนให้อ่านง่ายขึ้น','ภาษาโปรแกรมระดับสูง','ภาษากลางที่ใช้กับคอมพิวเตอร์ได้หลายชนิด','ภาษากำหนดการทำงานร่วมกันของอุปกรณ์'],0,''],['ขั้นตอน decode instruction ใน pipeline ทำงานอะไร',['อ่านรหัสคำสั่งเข้ามา','ตีความรหัสคำสั่งเพื่อเตรียมสั่งการ','คำนวณค่าผลลัพธ์','แปลงผลลัพธ์เพื่อเก็บในหน่วยความจำ'],1,''],['ตัวเลือกใดเป็นระบบปฏิบัติการ',['Apple','Google','Microsoft','Android'],3,'']]}],
fc:[['n บิต','แทนได้ 2ⁿ แบบ'],['10010000','= 144'],['1011','= 11'],['XOR','ต่างกันได้ 1'],['De Morgan','NOT(NOT A AND NOT B) = A OR B'],['ทรานซิสเตอร์','สวิตช์เชิงไฟฟ้า'],['Volatile','RAM, Cache, Register'],['Non-volatile','Disk, SSD, ROM'],['Pipeline','Fetch → Decode → Execute → Write back'],['BIOS','ตรวจฮาร์ดแวร์ตอนเปิดเครื่อง'],['Driver','คุมอุปกรณ์ต่อพ่วงร่วมกับ OS']]},

{k:'mix',name:'สุ่มทดสอบ',n:15,mods:[],fc:[]}];
const S={};let cur=0;const STP=[];const sc=k=>{const v=S[k]||[0,0];return v[0]+'/'+v[1]};
function nav(){$('nav').innerHTML=T.map((t,i)=>`<button class="nv${i===cur?' on':''}" data-i="${i}">${t.k==='mix'?'':(i+1)+'. '}${t.name}<small>${t.k==='mix'?'ทุกหัวข้อ · '+sc('mix'):'ออก '+t.n+' ข้อ · '+sc(t.k)}</small></button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{render(+b.dataset.i);window.scrollTo(0,0)});const on=$('nav').querySelector('.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest',inline:'center'})}
function quizInto(el,qs,k){el.innerHTML=qs.map((q,i)=>`<div class="q" data-i="${i}"><p class="qt">${i+1}. ${q[0]}${q[4]?` <span class="pill a" style="font-size:11px;padding:1px 6px">${q[4]}</span>`:''}</p>${q[1].map((o,j)=>`<button class="op" data-j="${j}">${o}</button>`).join('')}<p class="why"></p></div>`).join('');el.querySelectorAll('.q').forEach(d=>{const q=qs[+d.dataset.i];d.querySelectorAll('.op').forEach(b=>b.onclick=()=>{if(d.dataset.done)return;d.dataset.done=1;const j=+b.dataset.j,ok=j===q[2];d.querySelectorAll('.op')[q[2]].classList.add('g');if(!ok)b.classList.add('r');const w=d.querySelector('.why');w.style.color=ok?'var(--text-success)':'var(--text-danger)';w.textContent=(ok?'ถูกต้อง':'ยังไม่ถูก ข้อที่ถูกไฮไลต์สีเขียว')+(q[3]?' · '+q[3]:'');S[k]=S[k]||[0,0];S[k][1]++;if(ok)S[k][0]++;const ts=$('tsc');if(ts)ts.textContent=sc(k);nav()})})}
function blk(b){const [ty,v]=b;
if(ty==='h')return `<h3 class="bh">${v}</h3>`;
if(ty==='p')return `<p class="ex">${v}</p>`;
if(ty==='note')return `<div class="note"><i class="ti ti-alert-circle" aria-hidden="true"></i><span>${v}</span></div>`;
if(ty==='def')return `<div class="gl">${v.map(g=>`<div class="gt">${g[0]}</div><div class="gd">${g[1]}${g[2]?`<span class="gx">ตัวอย่าง: ${g[2]}</span>`:''}</div>`).join('')}</div>`;
if(ty==='f')return `<div class="fx"><div class="fxm">${v[0]}</div>${v[1]?`<div class="fxe">${v[1]}</div>`:''}${v[2]?`<div class="fxx"><span>ตัวอย่าง</span>${v[2]}</div>`:''}</div>`;
if(ty==='fig'){const f=F[v];return `<div class="fig"><p class="fh">${f.h}</p>${f.s?`<p class="s">${f.s}</p>`:''}<div class="sx">${f.html}</div></div>`}
if(ty==='lab'){const l=L[v];return `<div class="lab"><p class="lb"><i class="ti ti-flask" aria-hidden="true"></i> แล็บ: ${l.h}</p><p class="s">${l.s}</p><div class="sx">${l.html}</div></div>`}
if(ty==='steps'){const id=STP.length;STP.push(v);return `<div class="stp" data-s="${id}"><p class="fh"><i class="ti ti-list-numbers" aria-hidden="true"></i> ${v.t}</p><div class="stn">${v.i.map((x,j)=>`<button data-j="${j}"><span class="sn">${j+1}</span>${x[0]}</button>`).join('')}</div><div class="stb"></div><div class="rw" style="margin:8px 0 0"><button class="sp"><i class="ti ti-arrow-left" aria-hidden="true"></i> ขั้นก่อนหน้า</button><button class="snx">ขั้นถัดไป <i class="ti ti-arrow-right" aria-hidden="true"></i></button><span class="s sc" style="margin:0"></span></div></div>`}
return ''}
function initSteps(){document.querySelectorAll('.stp').forEach(el=>{const d=STP[+el.dataset.s];let k=0;const bs=el.querySelectorAll('.stn button');const set=()=>{bs.forEach((b,j)=>{b.classList.toggle('on',j===k);b.classList.toggle('dn',j<k)});el.querySelector('.stb').innerHTML=`<p class="stt">ขั้นที่ ${k+1}: ${d.i[k][0]}</p><p class="ex" style="margin:0">${d.i[k][1]}</p>`;el.querySelector('.sc').textContent=`${k+1} จาก ${d.i.length}`};bs.forEach(b=>b.onclick=()=>{k=+b.dataset.j;set()});el.querySelector('.sp').onclick=()=>{if(k>0)k--;set()};el.querySelector('.snx').onclick=()=>{if(k<d.i.length-1)k++;set()};set()})}
function modHTML(m,i){return `<section class="md" id="m-${i}"><div class="mh"><span class="mn">บทที่ ${i+1}</span><h2 class="mt">${m.t}</h2></div><p class="goal"><i class="ti ti-target" aria-hidden="true"></i> บทนี้: ${m.goal}</p>${m.b.map(blk).join('')}
${m.tips.length?`<div class="sec tipbox"><p class="lb"><i class="ti ti-target-arrow" aria-hidden="true"></i> สรุปจุดที่ข้อสอบชอบถาม</p><ul class="tp">${m.tips.map(t=>`<li>${t}</li>`).join('')}</ul></div>`:''}
${m.q.length?`<div class="sec"><p class="lb"><i class="ti ti-checkbox" aria-hidden="true"></i> ลองตอบ</p><div class="qz" data-m="${i}"></div></div>`:''}</section>`}
function render(i){cur=i;STP.length=0;nav();const t=T[i];try{history.replaceState(null,'','#'+t.k)}catch(e){}
if(t.k==='mix'){$('view').innerHTML=`<div class="rw" style="margin:0 0 1rem"><div class="st"><span>สุ่มจากทุกหัวข้อ</span><b>15 ข้อ</b></div><div class="st"><span>คะแนนรวม</span><b id="tsc">${sc('mix')}</b></div></div><section class="md"><div class="mh"><h2 class="mt">สุ่มทดสอบรวม</h2></div><p class="s" style="margin-top:10px">คละทุกหัวข้อเหมือนวันสอบจริง กดสุ่มใหม่เพื่อเปลี่ยนชุดข้อสอบ</p><div class="qz" id="qzm"></div><button id="qr" style="margin-top:12px"><i class="ti ti-refresh" aria-hidden="true"></i> สุ่มใหม่</button></section>`;const go=()=>{const all=T.flatMap(x=>(x.mods||[]).flatMap(m=>m.q.map(q=>[...q,x.name])));for(let a=all.length-1;a>0;a--){const b=Math.floor(Math.random()*(a+1));[all[a],all[b]]=[all[b],all[a]]}quizInto($('qzm'),all.slice(0,15),'mix')};$('qr').onclick=go;go();return}
let h=`<div class="rw" style="margin:0 0 .75rem"><div class="st"><span>ออกสอบ</span><b>${t.n} ข้อ</b></div><div class="st"><span>ควิซหัวข้อนี้</span><b id="tsc">${sc(t.k)}</b></div><p class="s" style="margin:0;flex:1;min-width:200px">${t.intro}</p></div><div class="toc">${t.mods.map((m,j)=>`<button data-j="${j}"><span class="mn">${j+1}</span> ${m.t}</button>`).join('')}<button data-j="fc"><i class="ti ti-cards" aria-hidden="true"></i> แฟลชการ์ด</button></div>`;
h+=t.mods.map(modHTML).join('');h+=`<section class="md" id="m-fc"><div class="mh"><span class="mn">ทวน</span><h2 class="mt">แฟลชการ์ด</h2></div><p class="s" style="margin-top:10px">นึกคำตอบในใจก่อน แล้วกดการ์ดเพื่อพลิกดู</p><div class="fcg">${t.fc.map((f,j)=>`<button class="fc" data-j="${j}">${f[0]}</button>`).join('')}</div></section>`;
$('view').innerHTML=h;t.mods.forEach(m=>m.b.forEach(b=>{if(b[0]==='fig'&&F[b[1]].init)F[b[1]].init();if(b[0]==='lab'&&L[b[1]].init)L[b[1]].init()}));initSteps();document.querySelectorAll('.qz[data-m]').forEach(el=>quizInto(el,t.mods[+el.dataset.m].q,t.k));document.querySelectorAll('.fc').forEach(b=>b.onclick=()=>{const f=t.fc[+b.dataset.j],on=b.classList.toggle('on');b.innerHTML=on?f[1]:f[0]});document.querySelectorAll('.toc button').forEach(b=>b.onclick=()=>{const el=$('m-'+b.dataset.j);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})})}
const start=T.findIndex(t=>'#'+t.k===location.hash);render(start>=0?start:0);
</script>
</main>
